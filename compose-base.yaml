name: bridge_base_stack
services:
  bridge_base:
    image: "${BRIDGE_BASE_IMAGE:-localhost/umrt-base-station:latest}"
    container_name: bridge_base
    stdin_open: true
    tty: true
    init: true
    privileged: true
    cap_add:
      - NET_ADMIN
    environment:
      BOOT_FOXGLOVE:  true
      BOOT_JOYSTICK: true
      
      BOOT_LO_NET: true
      BOOT_HI_NET: true
      BOOT_HI_F_LO_NET: true
      BOOT_LO_F_HI_NET: true
      BOOT_LOC_NET: true
      BOOT_ALL_NET: true
    ports:
      - "${FOXGLOVE_HOST_BIND:-0.0.0.0}:8765:8765/tcp"
      - 0.0.0.0:8080:8080/tcp
    volumes:
      - "${RES_CONFIG_DIR:-./config}:/${BRIDGE_WORKSPACE:-/workspace/umrt-zenoh-bridge}/config"
      - "${RES_MAPTILES_DIR:-../maptiles}:/maptiles"
    devices:
      - "/dev/input:/dev/input"
    networks:
      bridge_lo:
        ipv4_address: 10.0.10.21
      bridge_hi:
        ipv4_address: 10.0.20.21
      foxglove_local: {}
networks:
  foxglove_local:
    driver: bridge
  bridge_lo:
    name: bridge_lo
    driver: ipvlan
    driver_opts:
      ipvlan_mode: l2
      parent: ens33.10
    ipam:
      driver: default
      config:
        - subnet: 10.0.10.0/24
          gateway: 10.0.10.1
  bridge_hi:
    name: bridge_hi
    driver: ipvlan
    driver_opts:
      ipvlan_mode: l2
      parent: ens33.20
    ipam:
      driver: default
      config:
        - subnet: 10.0.20.0/24
          gateway: 10.0.20.1
